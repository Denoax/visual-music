<!doctype html>
<html lang="en" data-color-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Visual Music</title>
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <canvas
      id="world"
      aria-label="Music-reactive LED waves. Move to steer; hold the scene to fly faster, or drag one finger; focus the scene for arrow keys or WASD. The native pointer stays visible."
      tabindex="0"
    ></canvas>
    <div class="bumer-ui">
      <section
        id="entrance"
        class="landing"
        data-phase="loading"
        aria-label="Preparing the music experience"
      >
        <div class="landing-stage">
          <div class="landing-rail" aria-hidden="true">
            <div class="landing-fill"></div>
          </div>
          <div class="landing-ball" aria-hidden="true"></div>
          <button
            id="start"
            class="landing-play"
            disabled
            aria-label="Click to continue"
            tabindex="-1"
          >
            <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true">
              <path d="M9 5.8 18 12l-9 6.2Z" fill="currentColor" />
            </svg>
          </button>
          <p class="landing-invitation" aria-hidden="true">click to continue</p>
        </div>
      </section>
      <p
        id="status"
        class="landing-status"
        role="status"
        aria-live="polite"
      ></p>
      <button id="retry" class="ui-action" hidden>Retry</button>
      <!-- During the music this is the only top-level visible control. -->
      <button
        id="settings-button"
        class="single-settings"
        type="button"
        aria-haspopup="dialog"
        aria-controls="settings"
        aria-expanded="false"
        hidden
      >
        Settings
      </button>
      <section
        id="thank-you"
        class="thank-you"
        hidden
        tabindex="-1"
        aria-labelledby="thanks-title"
      >
        <h1 id="thanks-title">thank you</h1>
        <canvas class="thank-you-confetti" aria-hidden="true"></canvas>
      </section>

      <dialog
        id="settings"
        class="experience-settings glass-window"
        aria-labelledby="settings-title"
      >
        <div class="settings-panel">
          <div class="settings-heading">
            <h2 id="settings-title">Settings</h2>
            <button
              class="settings-close pane-close"
              aria-label="Close settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="m6 6 12 12M18 6 6 18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <div class="settings-body">
            <div id="brightness-slider" class="angry-slider">
              <div class="angry-slider-label">
                <label for="brightness">Brightness</label
                ><output for="brightness">100%</output>
              </div>
              <div class="angry-slider-gesture">
                <svg aria-hidden="true" width="100%" height="94">
                  <line class="angry-slider-track" x1="12" y1="46" y2="46" />
                  <line class="angry-slider-fill" x1="12" y1="46" y2="46" />
                  <ellipse rx="6" ry="6" /></svg
                ><input
                  id="brightness"
                  class="angry-slider-native"
                  aria-label="Brightness"
                  type="range"
                  min="80"
                  max="140"
                  step="1"
                  value="100"
                />
              </div>
            </div>
            <div id="volume-slider" class="angry-slider">
              <div class="angry-slider-label">
                <label for="volume">Sound volume</label
                ><output for="volume">70%</output>
              </div>
              <div class="angry-slider-gesture">
                <svg aria-hidden="true" width="100%" height="94">
                  <line class="angry-slider-track" x1="12" y1="46" y2="46" />
                  <line class="angry-slider-fill" x1="12" y1="46" y2="46" />
                  <ellipse rx="6" ry="6" /></svg
                ><input
                  id="volume"
                  class="angry-slider-native"
                  aria-label="Sound volume"
                  type="range"
                  min="0"
                  max="100"
                  step="1"
                  value="70"
                />
              </div>
            </div>
            <label class="settings-motion"
              ><span>Less motion</span
              ><input id="reduced" type="checkbox" role="switch"
            /></label>
            <div class="settings-actions">
              <button id="pause" class="ui-action" hidden>Pause</button>
              <button id="mute" class="ui-action" aria-pressed="false">
                Mute</button
              ><button id="fullscreen" class="ui-action">Fullscreen</button>
            </div>
            <p class="settings-credit">
              Controls from Mani’s portfolio and
              <a
                href="https://www.rareui.com/components/gooeynav"
                target="_blank"
                rel="noopener noreferrer"
                >Rare UI</a
              >. Space pauses; M mutes.
            </p>
            <button id="reset-settings" class="settings-reset">
              Reset settings
            </button>
          </div>
        </div>
      </dialog>
    </div>
    <aside id="developer" hidden><pre id="debug"></pre></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
